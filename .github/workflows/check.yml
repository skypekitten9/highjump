name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Read pinned Godot version
        id: godot
        run: echo "version=$(cat .godot-version)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot and dev tools
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            .tools
          key: tools-${{ runner.os }}-${{ steps.godot.outputs.version }}-${{ hashFiles('tools/check.py', 'tools/export_web.py') }}

      - name: Install Godot ${{ steps.godot.outputs.version }}
        env:
          GODOT_VERSION: ${{ steps.godot.outputs.version }}
        run: |
          binary="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          if [ ! -x "$binary" ]; then
            mkdir -p "$HOME/godot"
            curl -fsSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d "$HOME/godot"
          fi
          echo "GODOT_BIN=$binary" >> "$GITHUB_ENV"

      - name: Run all checks
        run: python tools/check.py

      # On PRs too, so a change that breaks the web export fails before it reaches main.
      - name: Export for the web
        run: python tools/export_web.py

      - name: Upload web build for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gdunit-report
          path: reports/
          if-no-files-found: ignore

  # Publishes the web build of every main commit that passes all checks.
  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Only the newest main commit publishes; an older deploy still running is cancelled.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
